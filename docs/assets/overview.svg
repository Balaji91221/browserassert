<text x="58" y="293" fill="#15243b" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Describe the result</text>
<text x="58" y="325" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="15">Choose a selector and expected value.</text>
