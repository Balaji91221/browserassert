<text x="1160" y="42" fill="#64748b" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1">BROWSERASSERT</text>
<text x="38" y="112" fill="#101b30" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-1">A click is an action.</text>
<text x="38" y="164" fill="#101b30" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-1">Persistence is the outcome.</text>
