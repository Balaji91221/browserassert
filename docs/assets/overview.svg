<text x="481" y="251" fill="#0284c7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">OBSERVE</text>
<text x="441" y="293" fill="#15243b" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Check the browser</text>
<text x="441" y="325" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="15">Read state; reload when requested.</text>
