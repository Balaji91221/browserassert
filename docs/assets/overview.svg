<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">BrowserAssert workflow overview</title>
<desc id="desc">A click is an action. Persistence is the outcome. Describe the result: Choose a selector and expected value.. Check the browser: Read state; reload when requested.. Keep the evidence: Verified, failed, or unknown.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="428" rx="20" fill="url(#wash)" stroke="#dbe3ee"/>
